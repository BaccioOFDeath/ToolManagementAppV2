<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><title>SD European — Parts Shop UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="products.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="ShopChrome.jsx"></script>
<script type="text/babel" src="ProductCard.jsx"></script>
<script type="text/babel" src="StorefrontScreen.jsx"></script>
<script type="text/babel" src="CollectionScreen.jsx"></script>
<script type="text/babel" src="ProductScreen.jsx"></script>
<script type="text/babel" src="CartDrawer.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState('home');
  const [cart,setCart]=React.useState([]);
  const [open,setOpen]=React.useState(false);
  const go=(s)=>{setScreen(s);window.scrollTo({top:0});};
  const add=(p,qty=1)=>{setCart(c=>{const e=c.find(x=>x.id===p.id);return e?c.map(x=>x.id===p.id?{...x,qty:x.qty+qty}:x):[...c,{...p,qty}];});setOpen(true);};
  const remove=(id)=>setCart(c=>c.filter(x=>x.id!==id));
  const S={home:StorefrontScreen,collection:CollectionScreen,product:ProductScreen}[screen];
  return <React.Fragment>
    <AnnouncementBar/><ShopUtilityBar/>
    <ShopHeader go={go} cartCount={cart.reduce((s,i)=>s+i.qty,0)} onCart={()=>setOpen(true)}/>
    <S go={go} add={add}/>
    <ShopFooter/>
    <CartDrawer open={open} items={cart} onClose={()=>setOpen(false)} onRemove={remove}/>
  </React.Fragment>;
}
const mount=()=>{ if(!window.SDEuropeanDesignSystem_614674||!window.StorefrontScreen||!window.CartDrawer){return setTimeout(mount,60);} ReactDOM.createRoot(document.getElementById('root')).render(<App/>); };
mount();
</script>
</body></html>
