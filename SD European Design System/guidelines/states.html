<!-- @dsCard group="Motion" viewport="700x160" name="Interaction states" subtitle="Hover darkens · press shrinks 1.5% · disabled fades to 45% · focus is a 2px yellow ring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(1,1,1,.08)}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-mono);font-size:11px;color:var(--text-muted)}.r{display:grid;gap:10px}</style></head><body><style>.b{font:var(--type-button);letter-spacing:.02em;border-radius:var(--radius-sm);height:44px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}</style>
<div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
<div class="sw"><span class="b" style="background:#FFC326;color:#010101">Rest</span><div class="v">#FFC326</div></div>
<div class="sw"><span class="b" style="background:#F2B211;color:#010101">Hover</span><div class="v">yellow-500</div></div>
<div class="sw"><span class="b" style="background:#D2990A;color:#010101;transform:scale(.985)">Press</span><div class="v">yellow-600 · scale .985</div></div>
<div class="sw"><span class="b" style="background:#FFC326;color:#010101;opacity:.45">Disabled</span><div class="v">opacity .45</div></div>
<div class="sw"><span class="b" style="background:#FFC326;color:#010101;outline:2px solid #FFC326;outline-offset:2px;box-shadow:var(--ring-focus)">Focus</span><div class="v">2px ring, 2px offset</div></div>
</div></body></html>
