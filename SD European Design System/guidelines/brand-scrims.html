<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(1,1,1,.08)}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-mono);font-size:11px;color:var(--text-muted)}.r{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">

<div style="position:relative;height:142px;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(135deg,#3a3d42,#6e7378)"><div style="position:absolute;inset:0;background:var(--scrim-left)"></div><div style="position:absolute;left:18px;top:50%;transform:translateY(-50%)"><div class="sd-eyebrow" style="color:var(--brand-yellow)">Scrim · left</div><div style="font:var(--type-h3);color:#fff;font-size:20px">Left-anchored copy</div></div></div>
</div></body></html>
