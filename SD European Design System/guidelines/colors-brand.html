<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(1,1,1,.08)}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-mono);font-size:11px;color:var(--text-muted)}.r{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div class="sw"><div class="chip" style="background:#010101;"></div><div class="n">Black</div><div class="v">#010101</div></div><div class="sw"><div class="chip" style="background:#FFC326;"></div><div class="n">Yellow</div><div class="v">#FFC326</div></div><div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid var(--neutral-200)"></div><div class="n">White</div><div class="v">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:#D8D8D8;"></div><div class="n">Grey</div><div class="v">#D8D8D8</div></div></div></body></html>
