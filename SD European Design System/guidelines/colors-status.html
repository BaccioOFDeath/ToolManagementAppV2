<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Stock, warranty and fault states — muted so they never fight the yellow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(1,1,1,.08)}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-mono);font-size:11px;color:var(--text-muted)}.r{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div class="sw"><div class="chip" style="background:#E7F3EB;display:grid;place-items:center"><span style="font:var(--type-label);letter-spacing:var(--ls-wide);text-transform:uppercase;color:#1E7A3C">In Stock</span></div><div class="n">Success</div><div class="v">#1E7A3C / #E7F3EB</div></div><div class="sw"><div class="chip" style="background:#FFF3DE;display:grid;place-items:center"><span style="font:var(--type-label);letter-spacing:var(--ls-wide);text-transform:uppercase;color:#B36A00">Low Stock</span></div><div class="n">Warning</div><div class="v">#B36A00 / #FFF3DE</div></div><div class="sw"><div class="chip" style="background:#FBEAE9;display:grid;place-items:center"><span style="font:var(--type-label);letter-spacing:var(--ls-wide);text-transform:uppercase;color:#B3261E">Discontinued</span></div><div class="n">Danger</div><div class="v">#B3261E / #FBEAE9</div></div><div class="sw"><div class="chip" style="background:#E8F0F6;display:grid;place-items:center"><span style="font:var(--type-label);letter-spacing:var(--ls-wide);text-transform:uppercase;color:#1F5C8C">Special Order</span></div><div class="n">Info</div><div class="v">#1F5C8C / #E8F0F6</div></div></div></body></html>
