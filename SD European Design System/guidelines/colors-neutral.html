<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid rgba(1,1,1,.08)}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-mono);font-size:11px;color:var(--text-muted)}.r{display:grid;gap:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(9,1fr);gap:10px"><div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid var(--neutral-200)"></div><div class="n">0</div><div class="v">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:#F2F2F2;"></div><div class="n">100</div><div class="v">#F2F2F2</div></div><div class="sw"><div class="chip" style="background:#D8D8D8;"></div><div class="n">200</div><div class="v">#D8D8D8</div></div><div class="sw"><div class="chip" style="background:#BDBDBD;"></div><div class="n">300</div><div class="v">#BDBDBD</div></div><div class="sw"><div class="chip" style="background:#949494;"></div><div class="n">400</div><div class="v">#949494</div></div><div class="sw"><div class="chip" style="background:#6B6B6B;"></div><div class="n">500</div><div class="v">#6B6B6B</div></div><div class="sw"><div class="chip" style="background:#4A4A4A;"></div><div class="n">600</div><div class="v">#4A4A4A</div></div><div class="sw"><div class="chip" style="background:#1A1A1A;"></div><div class="n">800</div><div class="v">#1A1A1A</div></div><div class="sw"><div class="chip" style="background:#010101;"></div><div class="n">1000</div><div class="v">#010101</div></div></div></body></html>
